# Blueprint de Render — VERSIÓN DE PRUEBA GRATUITA
# Crea solo el servicio web en plan gratis, sin base de datos de Render: la app
# guarda los datos en SQLite dentro del propio servicio. Así no usa la única
# base de datos gratuita de la cuenta ni toca otros proyectos.
#
# Importante: en el plan gratis el disco se reinicia cuando el servicio se
# "duerme" (unos 15 min sin uso) o se vuelve a publicar, y los datos de prueba
# se pierden. Sirve para ver y mostrar la app, no para clientes reales.
# Para producción: agrega una base PostgreSQL (DATABASE_URL) y usa planes pagados.
#
# En Render: New Blueprint Instance → este repositorio → elige la rama a publicar.
services:
  - type: web
    name: costos-para-restaurantes
    runtime: node
    plan: free
    buildCommand: npm install --prefix client --include=dev && npm run build --prefix client && npm install --prefix server --omit=dev
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      - key: TRIAL_DAYS
        value: "30"
      # true = al terminar la prueba, la app muestra "Prueba terminada" y bloquea el uso
      - key: ENFORCE_BILLING
        value: "true"
